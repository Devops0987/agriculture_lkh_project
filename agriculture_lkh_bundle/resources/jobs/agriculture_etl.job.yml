resources:
  jobs:
    test_etl:
      name: "agriculture_etl_refresh"
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../../src/notebooks/bronze/data_ingestion.ipynb
            base_parameters:
              ingestion_date: "{{job.start_time.iso_datetime}}"
              source_data: s3://af-data-store/landing/
              catalog: ${var.catalog}
            source: WORKSPACE
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../../src/notebooks/silver/data_transformation.ipynb
            base_parameters:
              ingestion_date: "{{job.start_time.iso_datetime}}"
              catalog: ${var.catalog}
            source: WORKSPACE
        - task_key: dim_crop
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../src/notebooks/gold/dim_crop.ipynb
            base_parameters:
              catalog: ${var.catalog}
            source: WORKSPACE
        - task_key: dim_irrigation
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../src/notebooks/gold/dim_irrigation.ipynb
            base_parameters:
              catalog: ${var.catalog}
            source: WORKSPACE
        - task_key: dim_season
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../src/notebooks/gold/dim_season.ipynb
            base_parameters:
              catalog: ${var.catalog}
            source: WORKSPACE
        - task_key: dim_soil
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../src/notebooks/gold/dim_soil.ipynb
            base_parameters:
              catalog: ${var.catalog}
            source: WORKSPACE
        - task_key: fact_crop_performance
          depends_on:
            - task_key: dim_crop
            - task_key: dim_irrigation
            - task_key: dim_season
            - task_key: dim_soil
          notebook_task:
            notebook_path: ../../src/notebooks/gold/fact_farm_performance.ipynb
            base_parameters:
              catalog: ${var.catalog}
            source: WORKSPACE
        - task_key: bussiness_queries
          depends_on:
            - task_key: fact_crop_performance
          notebook_task:
            notebook_path: ../../src/notebooks/business_kpi/aggerates_queries.ipynb
            base_parameters:
              catalog: ${var.catalog}
            source: WORKSPACE
        - task_key: farm_analytics
          depends_on:
            - task_key: bussiness_queries
          dashboard_task:
            subscription:
              subscribers:
                - user_name: abhijeet.waghmare@ltts.com
              attachment: {}
            warehouse_id: 3bbae399a33901db
            dashboard_id: 01f1e2790f881bd7994148b9c114160b
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
